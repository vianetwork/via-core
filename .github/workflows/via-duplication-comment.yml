name: Via Duplication Comment

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] trusted default-branch modules; artifacts are comment data only
    workflows: [Via Duplication]
    types: [completed]

permissions: {}

# Adapt FastPFOR's two-stage commenter; never load modules from PR/run head or artifact paths.
# https://github.com/fast-pack/FastPFOR-rs/blob/ebca273acf1de7644bd01bcbd79b03c61c1348ed/.github/workflows/pr-comments.yml
jobs:
  identity:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      number: ${{ steps.identity.outputs.number }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: .github/scripts
      - id: identity
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const {resolvePullRequest} = require('./.github/scripts/via-duplication/publisher.cjs');
            const current = await resolvePullRequest({github, context, core});
            if (current) core.setOutput('number', current.number);

  publish:
    if: needs.identity.outputs.number != ''
    needs: identity
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
    concurrency:
      group: via-duplication-comment-${{ needs.identity.outputs.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        continue-on-error: true
        with:
          name: via-duplication-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/via-duplication-artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - id: prepare
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const {preparePublication} = require('./.github/scripts/via-duplication/publisher.cjs');
            await preparePublication({github, context, core});
      - if: steps.prepare.outputs.publish == 'true'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: via-duplication
          number_force: ${{ steps.prepare.outputs.number }}
          path: ${{ steps.prepare.outputs.path }}
          skip_unchanged: true
